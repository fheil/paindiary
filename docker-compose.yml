services:
  schmerztagebuch-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schmerztagebuch-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      # NOTE: frontend/nginx.conf hardcodes "schmerztagebuch-backend:8030" at build time
      # and does NOT read this variable. If you change PORT, update nginx.conf too.
      - PORT=${PORT}
      - DATABASE_PATH=/app/data/schmerztagebuch.db
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://${DOMAIN}
    volumes:
      - backend-data:/app/data
    networks:
      - traefik-net
    expose:
      - "${PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.schmerztagebuch-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.schmerztagebuch-api.entrypoints=websecure"
      - "traefik.http.routers.schmerztagebuch-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.schmerztagebuch-api.loadbalancer.server.port=${PORT}"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.schmerztagebuch-api.middlewares=api-stripprefix"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  schmerztagebuch-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api
    container_name: schmerztagebuch-frontend
    restart: unless-stopped
    networks:
      - traefik-net
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.schmerztagebuch.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.schmerztagebuch.entrypoints=websecure"
      - "traefik.http.routers.schmerztagebuch.tls.certresolver=letsencrypt"
      - "traefik.http.services.schmerztagebuch.loadbalancer.server.port=80"
      - "traefik.http.routers.schmerztagebuch.priority=1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - schmerztagebuch-backend

volumes:
  backend-data:

networks:
  traefik-net:
    external: true
    