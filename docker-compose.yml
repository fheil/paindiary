services:
  paindiary-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paindiary-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      # NOTE: frontend/nginx.conf hardcodes "paindiary-backend:8030" at build time
      # and does NOT read this variable. If you change PORT, update nginx.conf too.
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://${DOMAIN}
    volumes:
      - backend-data:/app/data
    networks:
      - traefik-net
    expose:
      - "${PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paindiary-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.paindiary-api.entrypoints=websecure"
      - "traefik.http.routers.paindiary-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.paindiary-api.loadbalancer.server.port=${PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  paindiary-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api
    container_name: paindiary-frontend
    restart: unless-stopped
    networks:
      - traefik-net
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paindiary.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.paindiary.entrypoints=websecure"
      - "traefik.http.routers.paindiary.tls.certresolver=letsencrypt"
      - "traefik.http.services.paindiary.loadbalancer.server.port=80"
      - "traefik.http.routers.paindiary.priority=1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - paindiary-backend

volumes:
  backend-data:

networks:
  traefik-net:
    external: true
    